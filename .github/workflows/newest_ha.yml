name: Newest Home Assistant

# Once a week, test against the newest Home Assistant release, so changes in
# Home Assistant show up here before users report them. GitHub e-mails the
# person who last changed the schedule when a scheduled run fails.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Newest Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the newest pytest-homeassistant
        # Each release pins the Home Assistant release of the same number
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-homeassistant \
            -r requirements.txt -r requirements_dev.txt
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"

      - name: Type check with mypy
        run: mypy -p custom_components.hon

      - name: Run tests
        run: python -m pytest

      - name: Import every module without warnings
        # Home Assistant logs a warning when an integration uses a name it
        # has deprecated, often a year before the name stops working
        run: |
          python - <<'EOF'
          import importlib
          import logging
          import pkgutil
          import sys

          warnings = []


          class Collect(logging.Handler):
              def emit(self, record):
                  warnings.append(self.format(record))


          handler = Collect(logging.WARNING)
          handler.setFormatter(logging.Formatter("%(name)s: %(message)s"))
          logging.getLogger().addHandler(handler)

          import custom_components.hon as hon

          for module in pkgutil.iter_modules(hon.__path__):
              importlib.import_module(f"custom_components.hon.{module.name}")
          for warning in warnings:
              print(f"::warning::{warning}")
          sys.exit(1 if warnings else 0)
          EOF
