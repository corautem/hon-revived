name: Python check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Oldest release in hacs.json and the current one. pytest-homeassistant
        # is released with Home Assistant and pins the release of the same number.
        home-assistant: ["2026.11.0", "2026.11.2"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        env:
          HOME_ASSISTANT: ${{ matrix.home-assistant }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest-homeassistant==$HOME_ASSISTANT" \
            -r requirements.txt -r requirements_dev.txt

      - name: Check black style
        run: black --check .

      - name: Lint with flake8
        run: |
          # Syntax errors, undefined names and unused imports or variables
          flake8 . --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics

      - name: Type check with mypy
        run: mypy -p custom_components.hon

      - name: Run tests
        run: python -m pytest
