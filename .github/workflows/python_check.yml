name: Python check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest release in hacs.json and the current one. Each version of
          # pytest-homeassistant-custom-component pins one Home Assistant release.
          - home-assistant: "2026.7.4"
            test-plugin: "0.13.348"
          - home-assistant: "2026.9.4"
            test-plugin: "0.13.367"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        env:
          TEST_PLUGIN: ${{ matrix.test-plugin }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest-homeassistant-custom-component==$TEST_PLUGIN" \
            -r requirements.txt -r requirements_dev.txt

      - name: Check black style
        run: black --check .

      - name: Lint with flake8
        run: |
          # Syntax errors, undefined names and unused imports or variables
          flake8 . --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics

      - name: Type check with mypy
        run: mypy -p custom_components.hon

      - name: Run tests
        run: python -m pytest
