name: Release

on:
  release:
    types: [published]
  # Rebuild the asset of an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.19.2.1"
        required: true

permissions: {}

jobs:
  release-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the zip as a release asset
      contents: write
      # Sign the build provenance attestation for the zip
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check that the tag matches the manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/hon/manifest.json"))["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match manifest version $version"
            exit 1
          fi

      - name: ZIP component directory
        run: |
          cd custom_components/hon
          zip -r "$GITHUB_WORKSPACE/haier_hon.zip" . -x "*/__pycache__/*"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: haier_hon.zip

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" haier_hon.zip --clobber --repo "$GITHUB_REPOSITORY"
